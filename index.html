<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwagFishing Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="SwagFishing - Feature-rich fishing plugin for Minecraft">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
</head>
<body>
  <div id="app"></div>
  <div id="page-transition"></div>
  <script>
    window.$docsify = {
      name: 'SwagFishing',
      homepage: 'README.md',
      loadSidebar: 'sidebar.md',
      coverpage: 'coverpage.md',
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      themeColor: '#764ba2',
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true,
      },
      search: {
        paths: 'auto',
        placeholder: 'Search documentation...',
        depth: 3
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/progress-bar.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script>
    document.addEventListener('click', function(e) {
      var link = e.target.closest('section.cover a');
      if (!link) return;
      var href = link.getAttribute('href');
      // Skip external links (GitHub button etc.)
      if (!href || href.startsWith('http') || href.startsWith('//')) return;

      var overlay = document.getElementById('page-transition');
      overlay.classList.add('active');
      overlay.addEventListener('animationend', function() {
        overlay.classList.remove('active');
      }, { once: true });
    });
  </script>

  <style>
    :root {
      --theme-color: #764ba2;
      --theme-color-dark: #667eea;
    }

    /* ── Typography ── */
    body,
    .markdown-section {
      font-family: 'Inter', sans-serif !important;
    }

    .markdown-section code,
    .markdown-section pre,
    pre code {
      font-family: 'JetBrains Mono', monospace !important;
    }

    body {
      background-color: #1a1a1a !important;
    }

    /* ── Sidebar ── */
    .sidebar {
      background-color: #212121 !important;
      border-right: 1px solid #333 !important;
    }

    .sidebar-nav li.active > a {
      color: var(--theme-color) !important;
      border-right: 2px solid var(--theme-color) !important;
    }

    .sidebar-nav li a:hover {
      color: var(--theme-color) !important;
    }

    /* Home button */
    .sidebar-nav > ul > li:first-child > a {
      display: block;
      margin: 0 10px 8px;
      padding: 7px 14px;
      background: linear-gradient(135deg, rgba(102,126,234,0.15), rgba(118,75,162,0.15));
      border: 1px solid rgba(118,75,162,0.35);
      border-radius: 8px;
      color: #c0b3d8 !important;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none !important;
    }

    .sidebar-nav > ul > li:first-child > a:hover {
      background: linear-gradient(135deg, rgba(102,126,234,0.25), rgba(118,75,162,0.25));
      border-color: var(--theme-color);
      color: white !important;
    }

    /* Section headers (bold lines in sidebar.md) */
    .sidebar-nav > ul > li > p {
      color: #667eea;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin: 20px 0 6px 16px;
      padding-bottom: 4px;
      border-bottom: 1px solid #333;
    }

    /* ── Content area ── */
    .content {
      background-color: #1e1e1e !important;
    }

    .markdown-section {
      color: #e0e0e0 !important;
    }

    .markdown-section h1,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--theme-color) !important;
    }

    /* H2 accent left-border */
    .markdown-section h2 {
      color: var(--theme-color) !important;
      border-left: 3px solid var(--theme-color);
      padding-left: 12px;
      margin-left: -15px;
    }

    .markdown-section a {
      color: var(--theme-color-dark) !important;
    }

    .markdown-section a:hover {
      color: var(--theme-color) !important;
    }

    .markdown-section code {
      background-color: #2d2d2d !important;
      color: var(--theme-color-dark) !important;
    }

    /* Better code blocks */
    .markdown-section pre {
      background-color: #0d0d0d !important;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
    }

    /* ── Blockquotes / callouts ── */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color) !important;
      background-color: #2a2a2a !important;
      color: #e0e0e0 !important;
      border-radius: 0 6px 6px 0;
    }

    /* Tip — green */
    .markdown-section blockquote:has(strong:first-child) {
      border-left-color: #4caf50 !important;
    }

    /* ── Tables ── */
    .markdown-section table {
      background-color: #2d2d2d !important;
      border-radius: 8px;
      overflow: hidden;
    }

    .markdown-section thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    }

    .markdown-section thead th {
      color: white !important;
    }

    .markdown-section tbody tr {
      border-bottom: 1px solid #444 !important;
    }

    .markdown-section tbody tr:hover {
      background-color: #333 !important;
    }

    /* ── Cover page ── */
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    section.cover {
      position: relative !important;
      background: #0f0c29 !important;
    }

    section.cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #667eea, #764ba2);
      background-size: 300% 300%;
      animation: gradientShift 8s ease infinite;
      z-index: 0;
    }

    section.cover .cover-main {
      position: relative;
      z-index: 1;
    }

    section.cover h1 {
      font-size: 3.5rem !important;
      font-weight: 700 !important;
      letter-spacing: -1px !important;
    }

    section.cover .cover-main > blockquote {
      background: rgba(255, 255, 255, 0.1) !important;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 12px !important;
      border-left: none !important;
      padding: 14px 20px !important;
    }

    /* ── Search ── */
    .search input {
      background-color: #2d2d2d !important;
      border: 1px solid #444 !important;
      color: #e0e0e0 !important;
    }

    .search input:focus {
      border-color: var(--theme-color) !important;
    }

    /* ── Pagination ── */
    .pagination-item--next .pagination-item-title,
    .pagination-item--previous .pagination-item-title {
      color: var(--theme-color) !important;
    }

    .pagination-item a {
      color: var(--theme-color-dark) !important;
      border: 1px solid #333 !important;
      border-radius: 6px !important;
      padding: 8px 14px !important;
      text-decoration: none !important;
      transition: border-color 0.2s;
    }

    .pagination-item a:hover {
      border-color: var(--theme-color) !important;
    }

    /* ── Page transition overlay ── */
    @keyframes transitionFlash {
      0%   { opacity: 0; transform: scale(0.95); }
      40%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }

    #page-transition {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #667eea, #764ba2);
      background-size: 300% 300%;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
    }

    #page-transition.active {
      animation: transitionFlash 0.7s ease forwards;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #764ba2;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #667eea;
    }
  </style>
</body>
</html>
